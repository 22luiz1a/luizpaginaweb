<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Tech - Notícias e Curiosidades</title>
    
    <style>
        /* =========================================================
           ESTILOS (CSS)
           ========================================================= */
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --header-bg: #1e293b;
            --header-text: #ffffff;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
        }

        /* Estilos do Modo Escuro */
        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --header-bg: #020617;
            --header-text: #f8fafc;
            --border-color: #334155;
            --btn-bg: #334155;
            --btn-hover: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header */
        .header-principal {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 2rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .header-conteudo h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        #btn-theme {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #btn-theme:hover {
            background-color: var(--btn-hover);
        }

        /* Layout Grid */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Card do Post */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .post-imagem {
            width: 100%;
