<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* Banner Superior */
        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        header p {
            font-size: 0.95rem;
            margin: 0;
        }

        /* Container do Post com Flexbox */
        main {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f7faf7;
            padding: 16px;
            box-sizing: border-box;

            /* Aplicando o Flexbox para alinhar imagem e texto lado a lado */
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Estilo da Imagem ajustada para 80x80 */
        main img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        main h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Classe específica para destacar apenas o autor */
        .artigo-autor {
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        main .conteudo {
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <!-- Tag da Imagem primeiro -->
        <img src="images.blog.png" alt="Brinquedo do personagem Minion, amarelo e com óculos de proteção, segurando uma ferramenta azul e montado em um veículo cinza com rodas de engrenagem sobre fundo branco.">
        
        <!-- Div agrupando todos os textos do post -->
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Marcelo Paludetto</p>
            <p class="conteudo">Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        </div>
    </main>

</body>
</html>
