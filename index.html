<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* Banner Superior Preto */
        header {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        header p {
            font-size: 0.95rem;
            margin: 0;
        }

        /* Container do Post */
        main {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f7faf7;
            padding: 20px;
            box-sizing: border-box;
        }

        main h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        main .autor {
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        main .conteudo {
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Luiz Eduardo</p>
        <p class="conteudo">Seja Bem-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades sobre a tecnologia</p>
    </main>

</body>
</html>
