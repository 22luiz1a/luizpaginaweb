<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* Banner Superior com as cores e padding atualizados */
        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            /* Descomente a linha abaixo se quiser visualizar a borda para testes: */
            /* border: 5px solid #cf1010; */
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        header p {
            font-size: 0.95rem;
            margin: 0;
        }

        /* Container do Post com espaçamento interno (padding) */
        main {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f7faf7;
            padding: 16px;
            box-sizing: border-box;
        }

        main h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        main .autor {
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        main .conteudo {
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        /* Estilo da Imagem */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Luiz Eduardo</p>
        <p class="conteudo">Seja Bem-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades sobre a tecnologia</p>
        
        <!-- Tag da Imagem com o caminho da imagem enviada -->
        <img src="Gemini_Generated_Image_opngsuopngsuopng.jpeg" alt="Logotipo do blog Tecnologia 67 em tons de azul e roxo futurista">
    </main>

</body>
</html>
