<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Estilizada</title>
    
    <!-- Seção de Estilos (CSS) -->
    <style>
        /* Estilização do Cabeçalho */
        header {
            background-color: #2d3741; /* Azul escuro / Marinho */
            color: #FFFFFF;            /* Texto branco para alto contraste */
            text-align: center;         /* Centraliza o texto */
            max-width: 800px;           /* Largura máxima do elemento */
            margin: 0 auto;             /* Centraliza o bloco na tela */
            padding: 20px;              /* Espaçamento interno (opcional) */
        }

        /* Estilização do Conteúdo Principal */
        main {
            background-color: #FFFFFF; /* Fundo branco */
            color: #183C63;            /* Texto azul escuro */
            text-align: center;         /* Centraliza o texto */
            max-width: 800px;           /* Largura máxima do conteúdo */
            margin: 0 auto;             /* Centraliza o bloco na tela */
            padding: 20px;              /* Espaçamento interno (opcional) */
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Blog aura</h1>
        <p>Neste blog vou falar sobre as coisas que eu mais curto</p>
    </header>

    <main>
        <h2>Conteúdo Principal</h2>
        <p>Este é o texto principal da sua página. Ele agora está centralizado, com largura limitada a 800px e cores com ótimo contraste para facilitar a leitura.</p>
    </main>

</body>
</html>
